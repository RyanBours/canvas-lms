<%
  # CANVAS_DOMAIN is a host; tolerate a scheme or a trailing slash pasted with it.
  domain = ENV.fetch("CANVAS_DOMAIN").strip.sub(%r{\Ahttps?://}, "").chomp("/")
  raise "CANVAS_DOMAIN is empty" if domain.empty?
%>
production:
  domain: <%= domain.to_json %>
  ssl: <%= ENV.fetch("CANVAS_SSL", "false") == "true" %>
