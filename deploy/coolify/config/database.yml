production:
  adapter: postgresql
  encoding: utf8
  host: <%= ENV.fetch("CANVAS_DATABASE_HOST", "postgres").to_json %>
  username: <%= ENV.fetch("CANVAS_DATABASE_USERNAME", "postgres").to_json %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD").to_json %>
  database: canvas_production
  timeout: 5000
  prepared_statements: false
  use_qualified_names: true
  shard_name: public
  schema_search_path: "''"
